listen 1935;
max_connections 1000;
srs_log_tank console;
daemon off;

http_server {
    enabled on;
    listen 8080;
    dir ./objs/nginx/html;
    crossdomain on;
}

vhost __defaultVhost__ {
    hls {
        enabled on;
        hls_fragment 2;
        hls_window 10;
        hls_wait_keyframe on;
    }

    # Optional: let the GGTV studio approve encoders by stream key.
    # When enabled, publish to rtmp://<host>:1935/live/demo?key=<studio stream key>
    # (the key is shown on the Studio > Go Live page). The node backend must be running.
    # http_hooks {
    #     enabled on;
    #     on_publish http://host.docker.internal:3001/api/hooks/srs/on_publish;
    #     on_unpublish http://host.docker.internal:3001/api/hooks/srs/on_unpublish;
    # }
}