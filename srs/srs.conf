listen 1935;
max_connections 1000;
srs_log_tank console;
daemon off;

http_server {
    enabled on;
    listen 8080;
    dir ./objs/nginx/html;
    crossdomain on;
}

vhost __defaultVhost__ {
    hls {
        enabled on;
        hls_fragment 2;
        hls_window 10;
        hls_wait_keyframe on;
    }

    # The container entrypoint replaces the marker below with http_hooks pointing at the GGTV
    # backend when BACKEND_URL is set, so encoders must publish with the studio stream key:
    #   rtmp://<host>:1935/live/demo?key=<key from Studio > Go Live>
    # Without BACKEND_URL (e.g. local docker compose) publishing stays open.
    # @HTTP_HOOKS@
}